name: Keep site warm

# Render's free tier puts the site to sleep after 15 minutes without a request, and
# waking it shows Render's loading screen for about 50 seconds. Pinging every 5
# minutes, around the clock, leaves a 10-minute margin for GitHub's scheduler delays.
# Note: an always-awake service uses about 744 of the Render account's 750 free
# instance hours a month, shared with any other free services in the account.
on:
  schedule:
    # Every 5 minutes, 24 hours a day
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the GlowCart home page
        # --max-time covers a cold start, so a sleeping site is woken, not just poked
        run: curl --fail --silent --show-error --output /dev/null --write-out 'HTTP %{http_code} in %{time_total}s\n' --max-time 120 --retry 2 https://glow-cart-ecommerce.onrender.com/
