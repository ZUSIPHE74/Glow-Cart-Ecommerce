name: Keep site warm

# Render's free tier puts the site to sleep after 15 minutes without a request.
# GitHub throttles frequent schedules, so instead one long job pings in a loop for
# 5h40m. A trigger every hour queues the next loop behind the running one (the
# concurrency group allows one running and one waiting), so when a loop ends the
# next starts within seconds. GitHub can skip most hourly triggers and it still
# works, as long as one lands while each loop is running. The extra hourly runs
# that get replaced in the queue show as "cancelled": that's expected.
#
# Render hours: an always-awake service uses about 744 of the account's 750 free
# instance hours a month. Set the repository variable PING_MODERNTECH_HR=true
# (Settings > Secrets and variables > Actions > Variables) to also keep the
# ModernTech HR API awake, but two always-awake services need twice the hours.
on:
  schedule:
    # Hourly, at 7 past to avoid GitHub's busiest moment on the hour
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Ping every 5 minutes for 5h40m
        env:
          PING_MODERNTECH_HR: ${{ vars.PING_MODERNTECH_HR }}
        run: |
          failures=0
          ping() {
            # --max-time covers a cold start; a failed ping is logged, not fatal,
            # so one blip doesn't end the loop and leave a gap
            if out=$(curl --silent --show-error --output /dev/null --max-time 90 \
                --write-out '%{http_code} in %{time_total}s' "$1") && [[ $out == 2* ]]; then
              echo "$(date -u +%H:%M) $1 -> $out"
            else
              echo "::warning::$(date -u +%H:%M) $1 -> ${out:-no response}"
              return 1
            fi
          }
          end=$((SECONDS + 340 * 60))
          while true; do
            ping https://glow-cart-ecommerce.onrender.com/ || failures=$((failures + 1))
            if [[ $PING_MODERNTECH_HR == true ]]; then
              ping https://moderntech-hr-api.onrender.com/health || true
            fi
            (( SECONDS + 300 < end )) || break
            sleep 300
          done
          echo "Loop finished: $failures failed GlowCart ping(s)."
          # Fail only now, after the loop, so a red run flags trouble without a gap
          (( failures == 0 ))
