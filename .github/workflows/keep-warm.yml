name: Keep site warm

# Render's free tier puts the site to sleep after 15 minutes without a request, and
# waking it shows Render's loading screen for about 50 seconds. Pinging every 10
# minutes keeps it awake during the day. Not around the clock: free instance hours
# (750 a month) are shared across the Render account with the Lead Tracker API, so
# the two schedules together are kept under that limit.
on:
  schedule:
    # Every 10 minutes, 07:00-21:00 South African time (UTC+2), every day
    - cron: '*/10 5-18 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the home page
        # --max-time covers a cold start, so a sleeping site is woken, not just poked
        run: curl --fail --silent --show-error --output /dev/null --max-time 120 --retry 2 https://glow-cart-ecommerce.onrender.com/
