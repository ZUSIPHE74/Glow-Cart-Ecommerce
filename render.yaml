# Render Blueprint. If the service was created by hand in the dashboard, copy these
# settings there instead (see README "Deploying to Render").
services:
  - type: web
    name: GlowCart-Ecommerce
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: ./build.sh
    startCommand: cd main_project && gunicorn ecommerce_project.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Neon (or any Postgres) connection string. Without it, data is lost on restart.
      - key: DATABASE_URL
        sync: false
      # Payments: sandbox until you set your own PayFast merchant details and turn this off.
      - key: PAYFAST_SANDBOX
        value: "True"
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: MARKETPLACE_COMMISSION_PERCENT
        value: "10"
      - key: SELLER_NAME
        sync: false
      - key: SELLER_EMAIL
        sync: false
      - key: SELLER_PHONE
        sync: false
      - key: SELLER_ADDRESS
        sync: false
